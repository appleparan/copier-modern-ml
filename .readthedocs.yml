# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Read the Docs has no first-class ProperDocs support (only Sphinx and
    # MkDocs), so build the site ourselves into $READTHEDOCS_OUTPUT.
    build:
      html:
        - properdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

# We recommend specifying your dependencies to enable reproducible builds:
# https://docs.readthedocs.com/platform/stable/guides/reproducible-builds.html
python:
  install:
  - requirements: docs/requirements.txt
