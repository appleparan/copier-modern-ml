[project]
name = "copier-modern-ml"
version = "2.1.0"
description = "Personal Python machine learning project template with modern workflows made by copier"
readme = "README.md"
authors = [
    {name="Jongsu Liam Kim", email="jongsukim8@gmail.com"}
]
dependencies = [
    "copier==9.19.1",
    "copier-templates-extensions==0.3.2",
    "jinja2==3.1.6",
    "git-cliff==2.14.2",
]
requires-python = ">=3.12, <4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
]
[tool.uv]
package = false
# uv 0.13.4 drops the compromised emSign root CA (GHSA-hq85-5cpj-mr62)
required-version = ">=0.13.4"
managed = true

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tmp", "tmp-variants"]
addopts = ["-q"]
