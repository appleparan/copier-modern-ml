# Read the Docs configuration file
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "latest"
  jobs:
    install:
      # Read the Docs ships Node.js but not Bun; bootstrap it through npm.
      - npm install -g bun
      - bun install
    build:
      html:
        - bun run build
        - mkdir -p $READTHEDOCS_OUTPUT/
        - mv site $READTHEDOCS_OUTPUT/html
