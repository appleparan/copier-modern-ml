name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # pre-commit builds hook environments with python3.13
    # (default_language_version in .pre-commit-config.yaml); setup-uv
    # does not put an interpreter on PATH.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        version: "latest-known"

    - name: Run pre-commit
      run: uvx pre-commit run -a

    - name: Run tests
      run: uv run --group dev pytest

  test-project:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.13'}}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "dev@example.com"
        git config --global user.name "Jongsu Liam Kim"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        version: "latest-known"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Test project generation and workflow (Run on Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        CI=1 PYTHON_VERSION=${{ matrix.python-version }} bash tests/test_project.sh

    - name: Test project generation and workflow (Run on Windows)
      if: runner.os == 'Windows'
      run: |
        pwsh -Command tests/test_project.ps1 -CI -PythonVersion '${{ matrix.python-version }}'
